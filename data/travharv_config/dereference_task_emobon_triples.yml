snooze-till-graph-age-minutes: 100000
prefix:
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  dcat: http://www.w3.org/ns/dcat#
  schema: https://schema.org/
  org: http://www.w3.org/ns/org#
  dct: http://purl.org/dc/terms/
  mi: http://www.marineinfo.org/ns/ontology#
assert:
  - subjects:
      literal:
        - https://data.emobon.embrc.eu
    paths:
      - "*"
  - subjects: # get the data from all Catalogs , first the catalogs since they can contain more datasets
      SPARQL: >
        SELECT DISTINCT ?o
        WHERE { 
          {?s dcat:catalog ?o . }
          UNION
          {?s a dcat:Catalog . }
        }
    paths:
      - "*"
  - subjects: # get the data from all Datasets
      SPARQL: >
        SELECT DISTINCT ?o
        WHERE { 
          {?s dcat:dataset ?o . }
          UNION
          {?s a dcat:Dataset . }
        }
    paths:
      - "*"
  - subjects: # get the data from all marine regions mentioned in the datasets
      SPARQL: >
        PREFIX emobon: <https://data.emobon.embrc.eu/ns/core#>
        SELECT DISTINCT ?o
        WHERE  {
            ?observatory <http://www.w3.org/1999/02/22-rdf-syntax-ns#type> emobon:Observatory .
            ?observatory emobon:marineRegion ?o .
        }
    paths:
      - "*"
  - subjects: # get the data from all distributions ttl files
      SPARQL: >
        SELECT DISTINCT ?o
        WHERE {
              ?s ?p ?o .
              FILTER regex(str(?o), ".*\\.ttl$")
              }
    paths:
      - "*"
  - subjects: # get data from all downloadurls that are ttl files from s3 buckets
      SPARQL: >
        SELECT DISTINCT ?o
        WHERE {
            ?s ?p ?oo .
            FILTER regex(str(?oo), ".*\\.ttl$")
            ?oo schema:downloadUrl ?o
        }
    paths:
      - "*"
  - subjects:
      SPARQL: >
        PREFIX owl: <http://www.w3.org/2002/07/owl#> 
        PREFIX sosa: <http://www.w3.org/ns/sosa/>
        SELECT DISTINCT ?unit
        WHERE  {
          ?observations a sosa:Observation .
            ?observations sosa:observedProperty ?property .
            ?observationresult <http://qudt.org/schema/qudt/unit> ?unit .
            ?observationresult <http://qudt.org/schema/qudt/numericValue> ?resultnumeric .
            ?observations sosa:hasResult ?observationresult .
            ?observations sosa:hasFeatureOfInterest ?sample .
            ?sample sosa:hasResult ?metadatasample .
        }
    paths:
      - "*"
  - subjects:
      SPARQL: >
        PREFIX owl: <http://www.w3.org/2002/07/owl#> 
        PREFIX sosa: <http://www.w3.org/ns/sosa/>
        SELECT DISTINCT ?property
        WHERE  {
          ?observations a sosa:Observation .
            ?observations sosa:observedProperty ?property .
            ?observationresult <http://qudt.org/schema/qudt/unit> ?unit .
            ?observationresult <http://qudt.org/schema/qudt/numericValue> ?resultnumeric .
            ?observations sosa:hasResult ?observationresult .
            ?observations sosa:hasFeatureOfInterest ?sample .
            ?sample sosa:hasResult ?metadatasample .
        }
    paths:
      - "*"

